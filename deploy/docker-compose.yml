services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - site
      - crm

  site:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"

  crm:
    build:
      context: ../apps/crm
    restart: unless-stopped
    expose:
      - "8501"

  movie-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sym_user
      POSTGRES_PASSWORD: ${MOVIE_DB_PASSWORD:-sym_change_me}
      POSTGRES_DB: selectyourmovie_db
    volumes:
      - movie_pg:/var/lib/postgresql/data
    expose:
      - "5432"

  movie:
    build:
      context: /opt/selectyourmovie
      dockerfile: /opt/erdikus-me/deploy/movie.Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: movie-db
      PGPORT: "5432"
      PGUSER: sym_user
      PGPASSWORD: ${MOVIE_DB_PASSWORD:-sym_change_me}
      PGDATABASE: selectyourmovie_db
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_PAGES: ${TMDB_PAGES:-10}
      DUMMY_USER_COUNT: ${DUMMY_USER_COUNT:-120}
    depends_on:
      - movie-db
    expose:
      - "8501"

volumes:
  caddy_data:
  caddy_config:
  movie_pg:
